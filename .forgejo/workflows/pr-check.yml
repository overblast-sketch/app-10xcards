# Bramka PR na Forgejo Actions. Wymaga zarejestrowanego runnera
# (checklista uruchomienia: project-structure/pr-evaluation.md).
# Pipeline jest deterministyczny. Recenzja AI biegnie poza CI: sesja Codex na
# Macu publikuje status `ai-review` i komentarz przez API Forgejo
# (project-structure/pr-evaluation.md Warstwa 3, ADR-0003).

name: pr-check
on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pełna historia; płytki klon psuje diff względem bazy PR
      - name: Install
        run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
