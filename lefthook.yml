# Lokalne bramki jakości (warstwy: pre-commit szybkie, pre-push cięższe).
# Dostosuj komendy do stacku projektu. Dokumentacja: project-structure/pr-evaluation.md
# Instalacja: lefthook install

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: npx eslint {staged_files}
    typecheck:
      run: npx tsc --noEmit

commit-msg:
  commands:
    conventional:
      # Conventional Commits jako bramka, nie jako prosba (ADR-0014, RA-12).
      # Sprawdzana jest wylacznie pierwsza linia: stopka z "feat:" nie ratuje zlego
      # naglowka. Merge i Revert przepuszczane, bo generuje je git, nie autor.
      run: |
        head -1 {1} | grep -qE '^(Merge |Revert |(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\([a-z0-9._/-]+\))?!?: .+)' \
          || { echo "Naglowek commita musi byc w formacie Conventional Commits: <typ>(zakres): opis"; exit 1; }

pre-push:
  commands:
    tests:
      run: npm test
